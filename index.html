<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Galería</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    /* Contenedor flexible para alinear las fotos */
    .galeria {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap; /* Para que en celulares se acomoden una debajo de otra */
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Estilo de cada tarjeta de imagen */
    .tarjeta {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      max-width: 300px;
      flex: 1 1 300px;
    }

    .tarjeta img {
      width: 100%;
      height: 220px;
      object-fit: cover; /* Ajusta la imagen sin deformarla */
      display: block;
    }

    .pie-foto {
      padding: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Galería de Imágenes</h1>

  <div class="galeria">
    <!-- Imagen 1 -->
    <div class="tarjeta">
      <img src="foto1.jpg" alt="Descripción de la foto 1">
      <div class="pie-foto">Imagen 1</div>
    </div>

    <!-- Imagen 2 -->
    <div class="tarjeta">
      <img src="foto2.jpg" alt="Descripción de la foto 2">
      <div class="pie-foto">Imagen 2</div>
    </div>

    <!-- Imagen 3 -->
    <div class="tarjeta">
      <img src="foto3.jpg" alt="Descripción de la foto 3">
      <div class="pie-foto">Imagen 3</div>
    </div>
  </div>

</body>
</html>
